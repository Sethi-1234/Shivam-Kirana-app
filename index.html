<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16a34a">
  <meta name="google-site-verification" content="wD5m-KggU0ukfhlJQ2xydoBMdtCV9u3oS9LAwqwxZ7w">
<link rel="manifest" href="manifest.json">
<title>Shivam Kirana Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span>🛒</span><div><h1>Shivam Kirana Store</h1><small>Fresh groceries at your doorstep</small></div></div>
  <button id="cartBtn" class="cart">🛒 Cart <b id="cartCount">0</b></button>
</header>
<main>
  <section class="hero">
    <div><h2>Daily groceries, made easy.</h2><p>Shop your essentials and place your order quickly.</p></div>
  </section>
  <div class="search"><input id="search" placeholder="Search products..."> 🔎</div>
  <nav id="categories" class="chips"></nav>
  <section><h2>Products</h2><div id="products" class="grid"></div></section>
</main>

<div id="cartPanel" class="drawer hidden">
  <div class="drawerHead"><h2>Your Cart</h2><button id="closeCart">✕</button></div>
  <div id="cartItems"></div>
  <div class="total">Total: <strong id="total">₹0</strong></div>
  <button id="orderBtn" class="primary">Place Order on WhatsApp</button>
</div>

<div id="checkout" class="modal hidden">
  <div class="modalBox">
    <button id="closeCheckout" class="close">✕</button>
    <h2>Delivery Details</h2>
    <input id="name" placeholder="Your name">
    <input id="phone" placeholder="Phone number" inputmode="tel">
    <textarea id="address" placeholder="Delivery address"></textarea>
    <button id="sendOrder" class="primary">Send Order</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
